# seo-geo-content 最小 checklist。
# 只保留仍在使用的底线检查。

version: 3

checks:
  - id: "1"
    item: 首段直答字数
    applies_to: "landing_page / own_blog"
    rule_refs:
      - landing_page.thresholds.first_paragraph_direct_answer
      - own_blog.thresholds.first_paragraph_direct_answer
    automation: auto
    verifier: first_paragraph
    covered_must_include: [first_paragraph_direct_answer]

  - id: "2"
    item: FAQ 条数 + 单条字数
    applies_to: landing_page
    rule_refs: [shared.faq]
    automation: auto
    verifier: faq
    covered_must_include: []

  - id: "3"
    item: 权威引用（命中 authority.txt）
    applies_to: "must_include 含 at_least_one_authority_citation 的启用平台"
    rule_refs:
      - shared.authority_citations_min
      - rules/authority.txt
    automation: auto
    verifier: authority
    covered_must_include: [at_least_one_authority_citation]

  - id: "4"
    item: 更新日期信号
    applies_to: "must_include 含 update_date 的启用平台"
    rule_refs: []
    automation: auto
    verifier: update_date
    covered_must_include: [update_date]

  - id: "5"
    item: 字数 / 时长 / 条目数
    applies_to: "启用平台中有 word_count / duration_sec / items 字段的"
    rule_refs:
      - "<platform>.word_count"
      - "<platform>.duration_sec"
      - "<platform>.items"
    automation: auto
    verifier: word_count
    covered_must_include: []

  - id: "6"
    item: must_include 结构块
    applies_to: 每一个启用平台
    rule_refs: ["<platform>.must_include"]
    automation: semi
    verifier: must_include
    covered_must_include: []

  - id: "7"
    item: report §2 查询集合条数
    applies_to: report
    rule_refs: [shared.target_queries_in_report_min]
    automation: auto
    verifier: "(inline in verify.py)"
    covered_must_include: []

  - id: "8"
    item: 事实锚定（数字短语可追溯 facts.md）
    applies_to: 所有内容文件
    rule_refs: []
    automation: semi
    verifier: facts_trace
    covered_must_include: []
