# 各平台最小硬规则。
# 只保留下限，避免把写作系统重新做成复杂门禁系统。

shared:
  first_paragraph_direct_answer:
    min_chars: 40
    max_chars: 80
  faq:
    count_min: 3
    count_max: 8
    per_item:
      min_chars: 30
      max_chars: 120
  authority_citations_min: 1
  target_queries_in_report_min: 5

own_blog:
  word_count: { min: 1000, max: 3000 }
  title: { max: 60 }
  thresholds:
    first_paragraph_direct_answer: { ref: shared.first_paragraph_direct_answer }
  must_include:
    - first_paragraph_direct_answer
    - at_least_one_authority_citation
    - update_date
  tone: professional, evidence-first
  forbid:
    - 纯资料搬运
    - 无出处断言

landing_page:
  word_count: { min: 1200, max: 3500 }
  title: { max: 60 }
  thresholds:
    first_paragraph_direct_answer: { ref: shared.first_paragraph_direct_answer }
    faq: { ref: shared.faq }
  must_include:
    - first_paragraph_direct_answer
    - faq_section
    - at_least_one_authority_citation
    - internal_cta
  tone: direct, evidence-first
  forbid:
    - 夸大承诺
    - 没有行动入口

xiaohongshu:
  word_count: { min: 300, max: 800 }
  title: { max: 20 }
  thresholds:
    tags: { min: 5, max: 10 }
  must_include:
    - hook_first_line
    - scene_or_first_person
    - tags
  tone: 真实、口语、轻种草
  forbid:
    - 机构口吻
    - 硬广

wechat:
  word_count: { min: 1000, max: 3000 }
  title: { max: 30 }
  must_include:
    - hook_opening
    - action_checklist
    - cta
  tone: 稳、清楚、有承接
  forbid:
    - 平铺直叙

wechat_video:
  duration_sec: { min: 30, max: 60 }
  must_include:
    - hook_0_3s
    - core_conclusion_3_30s
    - cta_45_60s
    - shot_table
  tone: 结果前置，轻私域承接
  forbid:
    - 公域爆款腔
    - 纯硬广

douyin:
  duration_sec: { min: 15, max: 60 }
  must_include:
    - hook_0_2s
    - core_conclusion_2_10s
    - explanation_or_example
    - shot_table
  tone: fast, direct, public-feed-native
  forbid:
    - 长铺垫
    - 像微信私域视频

bilibili:
  duration_sec: { min: 60, max: 300 }
  must_include:
    - hook_0_5s
    - core_conclusion
    - explanation_section
    - shot_table
  tone: knowledge-first, steady, explanatory
  forbid:
    - 纯切片感
    - 只有结论没有展开

zhihu:
  word_count: { min: 1200, max: 3000 }
  title: { max: 40 }
  must_include:
    - conclusion_first
    - per_point_evidence
    - at_least_one_authority_citation
    - references
  tone: 专业、克制、有依据
  forbid:
    - 先铺垫后结论
    - 断言无出处

quora:
  word_count: { min: 600, max: 1800 }
  title: { max: 120 }
  must_include:
    - short_answer
    - clear_reasons
    - example
    - soft_cta
  tone: helpful, direct, low-promo
  forbid:
    - 先讲品牌再答题
    - 太像营销文

linkedin:
  word_count: { min: 300, max: 1200 }
  title: { max: 70 }
  must_include:
    - contrarian_or_insight_hook
    - first_person_voice
    - mini_case
    - hashtags
  tone: concise, first-person, B2B
  forbid:
    - 鸡汤
    - 新闻稿口吻

csdn:
  word_count: { min: 1000, max: 2500 }
  title: { max: 70 }
  must_include:
    - conclusion_first
    - setup_or_context
    - step_by_step_solution
    - gotchas
  tone: technical, practical, direct
  forbid:
    - 品牌宣传腔
    - 没有步骤或示例

cnblogs:
  word_count: { min: 1000, max: 2500 }
  title: { max: 80 }
  must_include:
    - conclusion_first
    - context_or_problem
    - practical_steps
    - tradeoff_or_gotchas
  tone: developer-first, reflective, practical
  forbid:
    - 品牌文案腔
    - 只有结论没有过程

baijiahao:
  word_count: { min: 800, max: 2200 }
  title: { max: 40 }
  thresholds:
    first_paragraph_direct_answer: { ref: shared.first_paragraph_direct_answer }
    faq: { ref: shared.faq }
  must_include:
    - first_paragraph_direct_answer
    - faq_section
    - update_date
    - at_least_one_authority_citation
  tone: answer-first, scan-friendly, search-distribution
  forbid:
    - 站内博客腔
    - 长铺垫后才给答案

toutiao:
  word_count: { min: 800, max: 2000 }
  title: { max: 35 }
  must_include:
    - conclusion_first
    - timely_context
    - examples_or_observations
    - clear_advice
  tone: readable, fast, information-feed-native
  forbid:
    - 空观点
    - 小标题重复

juejin:
  word_count: { min: 1000, max: 2400 }
  title: { max: 80 }
  must_include:
    - conclusion_first
    - practical_steps
    - code_or_command
    - gotchas
  tone: developer-community, practical, concise
  forbid:
    - 产品宣传腔
    - 没有实操细节

twitter_thread:
  items: { min: 6, max: 15 }
  per_item_chars: { max: 280 }
  must_include:
    - thread_hook
    - numbered_prefix
    - closing_cta
  tone: punchy, declarative
  forbid:
    - 长文切条

twitter:
  items: { min: 5, max: 12 }
  per_item_chars: { max: 280 }
  must_include:
    - strong_first_post
    - standalone_points
    - one_example_or_number
    - closing_cta
  tone: sharp, concise, insight-first
  forbid:
    - 重复同一观点
    - 首条不够强

tiktok:
  duration_sec: { min: 15, max: 60 }
  must_include:
    - hook_0_2s
    - core_conclusion_2_8s
    - visual_beats
    - shot_table
  tone: fast, native, scroll-stopping
  forbid:
    - ad-like delivery
    - 开头太慢

youtube:
  duration_sec: { min: 120, max: 900 }
  must_include:
    - hook_0_10s
    - core_conclusion_10_30s
    - explanation_section
    - shot_table
  tone: clear, explanatory, trust-building
  forbid:
    - 假 hype
    - 中段重复无展开

short_video:
  duration_sec: { min: 30, max: 90 }
  must_include:
    - hook_0_3s
    - core_conclusion_3_30s
    - cta_70_90s
    - shot_table
  tone: fast, visual, spoken
  forbid:
    - 超长铺垫
    - 无画面感

medium:
  word_count: { min: 1000, max: 2500 }
  title: { max: 70 }
  must_include:
    - subhead
    - tldr
    - closing_framework_or_list
  tone: analytical, readable
  forbid:
    - 纯 listicle
    - 无 thesis

substack:
  word_count: { min: 1000, max: 2500 }
  title: { max: 80 }
  must_include:
    - opening
    - personal_voice
    - takeaway_section
    - subscribe_or_reply_cta
  tone: personal, thoughtful, newsletter-native
  forbid:
    - 通用博客腔
    - 结尾没有订阅承接

devto:
  word_count: { min: 800, max: 2200 }
  title: { max: 80 }
  must_include:
    - tldr
    - practical_steps
    - code_or_command
    - gotchas
  tone: practical, dev-first
  forbid:
    - marketing copy
    - 没有实操

hackernoon:
  word_count: { min: 1000, max: 2400 }
  title: { max: 80 }
  must_include:
    - thesis
    - evidence
    - angle
    - closing_judgment
  tone: sharp, technical-media, opinionated
  forbid:
    - 普通教程腔
    - 没有明确观点
