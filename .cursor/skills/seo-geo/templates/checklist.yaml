# seo-geo 上线前自检 checklist（SSOT）
#
# 本文件是 11 条 checklist 的**唯一**事实源。
# - SKILL.md §确认点 B、tools/verify/README.md 的表格、report.md §4 的表格
#   都**只引用**本文件的 id 与字段名，不再复刻表格内容。
# - 改 checklist 只动本文件；下游文档与脚本跟着读。
#
# 字段含义：
#   id:                       checklist 编号（与 SKILL.md 保留的编号保持一致）
#   item:                     人话标题
#   applies_to:               适用范围（字符串解释或平台匹配规则）
#   rule_refs:                判定口径指向 `platform_rules.yaml` 的哪些字段（仅记字段路径，数字不落盘）
#   automation:               auto / semi（启发式 + SKIP） / manual
#   verifier:                 对应 tools/verify/checks/*.py 模块名；manual 条目为 null
#   covered_must_include:     本 check 已覆盖的 platform_rules.yaml#<platform>.must_include 条目列表
#                             (must_include.py 会读取本字段的并集作为"跳过表"，避免重复判定)
#
# 规则：
# - automation=auto 或 semi 的条目由 verify.py 跑出 PASS/FAIL/SKIP；Agent 读 verify_report.json 贴 report §4
# - SKIP 必须 Agent 补人工判定理由
# - 存在 FAIL → gate_pass=false → 不得宣告交付
# - `covered_must_include` 是 "must_include 去重" 的 SSOT：改这里，must_include.py 自动跟进

version: 2

checks:
  - id: "1"
    item: 首段直答字数
    applies_to: landing_page
    rule_refs: [landing_page.thresholds.first_paragraph_direct_answer]
    automation: auto
    verifier: first_paragraph
    covered_must_include: [first_paragraph_direct_answer]

  - id: "2"
    item: H2/H3 问题式标题比例
    applies_to: "landing_page / own_blog"
    rule_refs:
      - shared.question_style_headings_ratio_landing
      - shared.question_style_headings_ratio_blog
    automation: auto
    verifier: headings_ratio
    covered_must_include: [question_style_headings_ratio, question_style_subheadings]

  - id: "3"
    item: FAQ 条数 + 单条字数
    applies_to: landing_page
    rule_refs: [shared.faq]
    automation: auto
    verifier: faq
    # faq_section 的"存在性"仍由 must_include 判定，"条数+字数"由本 check 判
    # 所以不把 faq_section 放进 covered_must_include
    covered_must_include: []

  - id: "4"
    item: 权威引用（命中 authority.txt）
    applies_to: "must_include 含 at_least_one_authority_citation 的启用平台"
    rule_refs:
      - shared.authority_citations_min
      - config/authority.txt
      - "report.md §3 追加行业白名单（由 verify.py 自动合并）"
    automation: auto
    verifier: authority
    covered_must_include: [at_least_one_authority_citation]

  - id: "5"
    item: 证据链（数字就近链接）
    applies_to: "must_include 含 numeric_claims_with_citation 的启用平台"
    rule_refs: [shared.numeric_citation_ratio]
    automation: auto
    verifier: numeric_citation
    covered_must_include: [numeric_claims_with_citation]

  - id: "6"
    item: 更新日期信号
    applies_to: "must_include 含 update_date 的启用平台"
    rule_refs: []
    automation: auto
    verifier: update_date
    covered_must_include: [update_date]

  - id: "7"
    item: Schema 建议（JSON-LD）
    applies_to: "must_include 含 schema_suggestion 的启用平台"
    rule_refs:
      - shared.schema_landing
      - shared.schema_blog_required
      - shared.schema_blog_optional
    automation: auto
    verifier: schema
    covered_must_include: [schema_suggestion]

  - id: "8"
    item: 字数 / 时长 / 条目数
    applies_to: "启用平台中有 word_count / duration_sec / items 字段的"
    rule_refs:
      - "<platform>.word_count"
      - "<platform>.duration_sec"
      - "<platform>.items"
    automation: auto
    verifier: word_count
    covered_must_include: []

  - id: "9"
    item: must_include 结构块
    applies_to: 每一个启用平台
    rule_refs: ["<platform>.must_include"]
    automation: semi
    verifier: must_include
    covered_must_include: []

  - id: "10"
    item: report §2 查询集合条数
    applies_to: report
    rule_refs: [shared.target_queries_in_report_min]
    automation: auto
    verifier: "(inline in verify.py)"
    covered_must_include: []

  - id: "11"
    item: 事实锚定（数字短语可追溯 facts.md）
    applies_to: 所有内容文件
    rule_refs: []
    automation: semi
    verifier: facts_trace
    covered_must_include: []

# 启用平台（enabled_platforms）的定义：
#   Top 3（用户在确认点 A 选定）+ landing_page（无条件启用）
