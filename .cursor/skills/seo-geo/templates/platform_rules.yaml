# 各平台硬规则（本文件是所有硬数字的唯一真相源 / SSOT）
#
# 读法：
# - word_count / duration_sec：正文字数（不含 Markdown 符号/链接）或时长范围
# - title.max：标题字符数上限
# - thresholds：与 must_include 结构块配对的硬阈值（SKILL.md 的 checklist 直接引用这里的数字）
# - must_include：必含结构块（Agent 生成完逐项核对）
# - tone：调性指引
# - forbid：禁区（硬广、敏感词等）
#
# 自检 FAIL 时立即修改，不留给最后统一改。
# 要改数字只改这一个文件；其他所有 .md 模板只写"按 rules 的 thresholds"，禁止再落硬数字。

# ------------------------------------------------------------------
# 全局共用阈值（被多个平台引用；SKILL.md checklist 也读它）
# ------------------------------------------------------------------
shared:
  first_paragraph_direct_answer:
    min_chars: 40
    max_chars: 60
    note: 汉字计数；英文场景按 60–120 字符折算
  question_style_headings_ratio_landing: 0.5   # landing_page 要 ≥ 50%
  question_style_headings_ratio_blog: 0.4      # own_blog 要 ≥ 40%
  faq:
    count_min: 5
    count_max: 15
    per_item:
      min_chars: 30
      max_chars: 50
  numeric_citation_ratio: 0.5                  # 含数字/结论段落给就近链接的比例 ≥ 50%
  internal_links:
    min: 3
    max: 5
  external_authority_links:
    min: 2
    max: 3
  authority_citations_min: 1                   # 至少命中 config/authority.txt 1 条
  target_queries_in_report_min: 10             # report.md 的查询集合 ≥ 10 条
  intent_corpus_in_brief_min: 30               # brief.md 的意图语料库 ≥ 30 条
  schema_landing: [Organization, Article, FAQPage]
  schema_blog_required: [Article]
  schema_blog_optional: [HowTo, FAQPage]

# ------------------------------------------------------------------
# 平台级规则
# ------------------------------------------------------------------

own_blog:
  purpose: 独立站博客文章——SEO 主阵地，主题集群的一篇；与 landing_page 区别在于更偏长文/案例/行业观察，不强制 FAQ+CTA
  word_count: { min: 1200, max: 4000 }
  title: { max: 60 }
  meta_description: { max: 160 }
  thresholds:
    # 博客阈值与 shared 基本一致，只在问题式标题比例上略低于 landing_page
    first_paragraph_direct_answer: { ref: shared.first_paragraph_direct_answer }
    question_style_headings_ratio: { ref: shared.question_style_headings_ratio_blog }
    numeric_citation_ratio: { ref: shared.numeric_citation_ratio }
    authority_citations_min: { ref: shared.authority_citations_min }
    internal_links: { ref: shared.internal_links }
  must_include:
    - first_paragraph_direct_answer   # 首段直答（长度见 thresholds）
    - question_style_headings_ratio   # H2/H3 问题式占比（见 thresholds）
    - at_least_one_authority_citation # 权威引用（条数见 thresholds；域名命中 config/authority.txt）
    - numeric_claims_with_citation    # 含数字段落就近链接（比例见 thresholds）
    - internal_links                  # 站内链接（数量见 thresholds；至少 1 条回链 landing_page）
    - update_date                     # 文首/文末标注更新日期
    - schema_suggestion               # Article 必须 + 可选 HowTo/FAQPage（见 shared.schema_blog_*）
    - author_bio                      # 作者简介（E-E-A-T 信号）
  tone: professional, evidence-first, 允许一定观点与行业视角
  forbid:
    - 无出处的数字
    - 与 landing_page 重复度 ≥ 50% 的段落（要错位而非复刻）

landing_page:
  purpose: 主承载页，证据链 + Schema + FAQ + CTA 的最终落点（无论是否被用户选进 Top 3，本页必产）
  word_count: { min: 1500, max: 5000 }
  title: { max: 60 }
  meta_description: { max: 160 }
  thresholds:
    first_paragraph_direct_answer: { ref: shared.first_paragraph_direct_answer }
    question_style_headings_ratio: { ref: shared.question_style_headings_ratio_landing }
    faq: { ref: shared.faq }
    numeric_citation_ratio: { ref: shared.numeric_citation_ratio }
    authority_citations_min: { ref: shared.authority_citations_min }
    schema: { ref: shared.schema_landing }
  must_include:
    - first_paragraph_direct_answer   # 首段直答（长度见 thresholds，无铺垫）
    - question_style_headings_ratio   # H2/H3 问题式占比（见 thresholds）
    - faq_section                     # FAQ（条数与单条字数见 thresholds）
    - at_least_one_authority_citation # 权威引用（条数见 thresholds；域名命中 config/authority.txt）
    - numeric_claims_with_citation    # 含数字段落就近链接（比例见 thresholds）
    - update_date                     # 文首/文末标注更新日期
    - schema_suggestion               # JSON-LD 三段（见 thresholds.schema）
    - internal_cta                    # 清晰的询盘/注册/下载入口
  tone: professional, declarative, evidence-first
  forbid:
    - 夸大承诺（"最好/第一/唯一"等无证据表述）
    - 没有出处的数字

xiaohongshu:
  purpose: 清单/场景/避坑式种草，轻转化
  word_count: { min: 300, max: 1000 }
  title: { max: 20 }
  thresholds:
    hook_first_line_max_chars: 30
    tags: { min: 5, max: 10 }
  must_include:
    - hook_first_line                 # 首行钩子（字数见 thresholds；数字/对比/冲突/悬念之一）
    - numbered_list_or_checklist      # 有序清单或 checklist
    - scene_or_first_person           # 场景感或第一人称叙述
    - tags                            # 话题标签（数量见 thresholds）
    - cover_brief                     # 末尾附封面图思路（不生成图，描述版式即可）
  tone: 亲切、口语、真实、第一人称、适度 emoji
  forbid:
    - 机构化 / 说明书式写法
    - 硬广式 CTA

wechat:
  purpose: 公众号长文，私域沉淀，系列化与转化路径承接
  word_count: { min: 1200, max: 3500 }
  title: { max: 30 }
  thresholds:
    h2_count: { min: 3, max: 5 }
    action_checklist: { min: 3, max: 7 }
  must_include:
    - hook_opening                    # 痛点/故事/数据钩子开头
    - three_to_five_h2                # 小标题数量（见 thresholds.h2_count）
    - data_or_case_per_section        # 每节至少 1 条数据或案例
    - action_checklist                # 收尾行动清单（数量见 thresholds）
    - cta                             # 关注/咨询/领资料的明确入口
  tone: 专业、克制、有温度、避免标题党
  forbid:
    - 口水话开篇
    - 无证据的情绪化结论

zhihu:
  purpose: 长问答/长文，利于形成可被 AI 引用的段落
  word_count: { min: 1500, max: 4000 }
  title: { max: 40, style: "问题式（如何/为什么/是什么/对比/推荐）" }
  thresholds:
    authority_citations_min: { ref: shared.authority_citations_min }
    conclusion_first_max_points: 3
  must_include:
    - conclusion_first                # 先给 3 条内的结论（上限见 thresholds）
    - per_point_evidence              # 每个分点配数据/证据/引用
    - question_style_subheadings      # 小标题以问题形式
    - at_least_one_authority_citation # 权威引用（条数见 thresholds；域名命中 config/authority.txt）
    - actionable_ending               # 收尾给可执行清单
    - references                      # 可验证引用列表
  tone: 专家、冷静、有据可查
  forbid:
    - 抖机灵式开头
    - 不给出处的断言

linkedin:
  purpose: B2B 观点+数据+案例，品牌可信度建设
  word_count: { min: 400, max: 1300 }
  title: { max: 70 }
  thresholds:
    takeaway_bullets: { min: 3, max: 5 }
    hashtags: { min: 3, max: 5 }
    paragraph_max_lines: 3
  must_include:
    - contrarian_or_insight_hook      # 反共识或独到洞察开头
    - first_person_voice              # 通篇使用第一人称 "I/we"
    - data_point                      # 至少 1 个具体数字
    - mini_case                       # 1 个小案例或类比
    - takeaway_bullets                # 要点数量见 thresholds
    - hashtags                        # 行业 hashtag 数量见 thresholds
  tone: professional, confident, first-person, concise paragraphs
  forbid:
    - 泛泛的行业口号
    - 超过 thresholds.paragraph_max_lines 行的连续长段

twitter_thread:
  purpose: 短线程，便于转发与沉淀观点
  items: { min: 8, max: 18, recommended_min: 10, recommended_max: 14 }
  per_item_chars: { max: 280 }
  thresholds:
    data_point_min: 1
  must_include:
    - thread_hook                     # 首条一句话结论，制造打开欲
    - numbered_prefix                 # 每条 "N/" 开头
    - at_least_one_data_point         # 全线程数据数量见 thresholds
    - closing_cta                     # 末条给关注/收藏/链接
  tone: crisp, declarative, one sentence per tweet when possible
  forbid:
    - 情绪化大字报
    - 空洞的行业术语堆砌

short_video:
  purpose: 30–90 秒口播脚本，带分镜/字幕
  # 注意：短视频不用 word_count；SKILL.md checklist #8 用 duration_sec 替代
  duration_sec: { min: 30, max: 90 }
  thresholds:
    segments:
      hook: { start: 0, end: 3 }
      core: { start: 3, end: 30, max_points: 3 }
      explain: { start: 30, end: 70 }
      cta: { start: 70, end: 90 }
  must_include:
    - hook_0_3s                       # 0–3s 钩子（见 thresholds.segments.hook）
    - core_conclusion_3_30s           # 3–30s 核心结论（≤ thresholds.segments.core.max_points 条）
    - explanation_30_70s              # 30–70s 解释/例证
    - cta_70_90s                      # 70–90s 行动号召
    - shot_table                      # 分镜表：时间/画面/口播/字幕
  tone: 口语化、节奏快、首句必须抓人
  forbid:
    - 大段无画面指引的口播
    - 超长铺垫

medium:
  purpose: 英文长文，沉淀体系化内容
  word_count: { min: 1200, max: 3000 }
  title: { max: 70 }
  thresholds:
    tldr_max_points: 3
  must_include:
    - subhead                         # 副标题（概括核心主张）
    - tldr                            # 开头 TL;DR（上限见 thresholds）
    - per_section_data                # 每节至少 1 个数据/引用
    - closing_framework_or_list       # 收尾给框架/清单
    - author_note                     # 作者简介（1–2 句）
  tone: analytical, well-structured, evidence-first, conversational
  forbid:
    - listicle-only structure without depth
    - unsourced claims
